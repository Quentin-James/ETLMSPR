version: '3.8'

services:
  db:
    image: postgres:15
    container_name: healthai_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8085:8080"
    depends_on:
      - db

volumes:
  postgres_data: